name: deploy supabase

# Every push to main sends migrations and every edge function to the hosted
# project. SB_AUTH_HOOK_SECRET is here only because config.toml reads it with
# env() and the CLI refuses to parse a config whose hook secret is empty.
# Function secrets are pushed by hand from supabase/.env.hosted, see README.
# The web app deploys from Vercel's Git integration on the same push.
# Compute is built for validation only; its deployment is a manual demo action.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/light-gate.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SB_AUTH_HOOK_SECRET: ${{ secrets.SB_AUTH_HOOK_SECRET }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DEMO_ORG_SLUG: ${{ vars.DEMO_ORG_SLUG }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: beta

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compute:build

      - run: supabase link --project-ref "$PROJECT_ID"

      - run: supabase db push

      - run: supabase functions deploy --project-ref "$PROJECT_ID"

      - name: Reconcile and ingest demo source documents
        run: node scripts/deploy-corpus.mjs

  release-ready:
    name: Production release ready
    needs: [checks, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Validation and Supabase deployment succeeded for this commit.'
