name: light gate

# Pull requests validate directly; production deploy calls this same workflow.
on:
  workflow_call:
  pull_request:

concurrency:
  group: light-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No version here: the action reads packageManager from package.json, and
      # naming a second one failed every run with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # No secrets: every light step runs on the checkout alone. The web build
      # validates env at request time, not at build time, and the secrets check
      # skips itself when neither env file is present.
      - name: light gate
        run: node scripts/gate.mjs --light --strict
